<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>StageTimer — Modo Operador (Mobile)</title>
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/operator.css">
</head>
<body>
  <div class="op-app">
    <!-- Header -->
    <header class="op-header">
      <div class="op-room-box">
        <span style="font-size: 1.2rem;">📱</span>
        <input id="op-room-input" class="input input-mono op-room-input" value="PALCO1" aria-label="Room Code">
        <button id="op-join-btn" class="btn btn-primary op-join-btn">Sala</button>
      </div>

      <div id="op-conn-badge" class="connection-badge connected">
        <span class="connection-dot"></span> Online
      </div>
    </header>

    <!-- Mode Switcher Bar -->
    <div style="display: flex; justify-content: space-between; align-items: center; padding: 8px 16px 0;">
      <div class="mode-nav">
        <a id="nav-controller" href="controller.html" class="mode-pill">🎛️ Controlador</a>
        <a id="nav-operator" href="operator.html" class="mode-pill active">📱 Operador</a>
        <a id="nav-viewer" href="viewer.html" class="mode-pill" target="_blank">📺 Palco</a>
        <a id="nav-lineup" href="lineup.html" class="mode-pill" target="_blank">📋 Lista</a>
      </div>
      <div style="display: flex; align-items: center; gap: 4px;">
        <span style="font-size: 0.7rem; color: var(--text-secondary);">Fundo:</span>
        <input type="color" id="op-bg-color" value="#000000" style="width: 26px; height: 26px; border: 1px solid var(--border); border-radius: 6px; background: transparent; padding: 0;">
      </div>
    </div>

    <!-- Live Stage Hero Display -->
    <section id="op-hero" class="op-hero">
      <div id="op-hero-badge" class="op-hero-badge">PARADO</div>
      <div id="op-hero-name" class="op-hero-name">Main Keynote</div>
      <div id="op-hero-time" class="op-hero-time">05:00</div>
      <div style="display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; margin-bottom: 6px;">
        <div id="op-hero-endtime" style="font-size: 0.78rem; color: #cbd5e1; font-family: var(--font-mono); font-weight: 600; background: rgba(255,255,255,0.08); padding: 3px 9px; border-radius: 6px;"></div>
        <div id="op-event-end-box" style="font-size: 0.85rem; color: #55efc4; font-family: var(--font-mono); font-weight: 800; background: rgba(0, 184, 148, 0.16); border: 1px solid rgba(0, 184, 148, 0.45); padding: 3px 10px; border-radius: 6px;">🏁 FIM DO EVENTO: <span id="op-event-end">--:--</span></div>
      </div>
      <div id="op-hero-notes" style="font-size: 0.8rem; color: #cbd5e1; text-align: center; margin-bottom: 4px;"></div>
      <div id="op-hero-next" style="font-size: 0.72rem; color: #a29bfe; font-weight: 700; letter-spacing: 0.08em;"></div>
      <div class="op-hero-progress">
        <div id="op-hero-bar" class="op-hero-progress-bar" style="width: 0%"></div>
      </div>
    </section>

    <!-- Giant Touch Controls -->
    <section class="op-controls">
      <div class="op-primary-controls">
        <button id="op-btn-toggle" class="btn op-btn-giant op-btn-play">
          ▶ INICIAR
        </button>
        <button id="op-btn-reset" class="btn op-btn-giant op-btn-reset">
          ⏹ RESET
        </button>
      </div>

      <div class="op-adjust-controls">
        <button id="op-btn-minus1m" class="btn op-btn-nudge">-1 Min</button>
        <button id="op-btn-plus1m" class="btn op-btn-nudge">+1 Min</button>
        <button id="op-btn-plus5m" class="btn op-btn-nudge">+5 Min</button>
      </div>
    </section>

    <!-- Quick Stage Prompter Message -->
    <section class="op-section">
      <div class="op-section-title">
        <span>💬 Mensagem de Palco</span>
        <span id="op-msg-status" style="color: var(--accent); font-size: 0.7rem;"></span>
      </div>
      <div class="op-msg-row">
        <input id="op-msg-input" class="input op-msg-input" placeholder="Escreva a mensagem...">
        <button id="op-msg-clear" class="btn btn-danger" style="padding: 0 14px;">✕</button>
      </div>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px;">
        <button id="op-msg-info" class="btn btn-primary" style="padding: 10px; font-weight: 600; border-radius: 10px;">💬 Informativo</button>
        <button id="op-msg-urgent" class="btn" style="padding: 10px; font-weight: 600; border-radius: 10px; background: #d63031; border-color: #d63031; color: #fff;">🔴 Urgente</button>
      </div>
      <div class="op-presets">
        <button class="op-preset-chip" data-level="urgent" data-msg="Por favor, conclua!">⏳ Concluir!</button>
        <button class="op-preset-chip" data-level="info" data-msg="Últimos 2 minutos">⚠️ 2 Minutos</button>
        <button class="op-preset-chip" data-level="urgent" data-msg="Tempo Esgotado!">🛑 Tempo Esgotado</button>
        <button class="op-preset-chip" data-level="info" data-msg="Fale mais perto do microfone">🎤 Microfone</button>
      </div>
    </section>

    <!-- Create New Artist / Act -->
    <section class="op-section">
      <div class="op-section-title">
        <span>🎤 Adicionar Novo Artista / Ato</span>
      </div>
      <div class="op-msg-row">
        <input id="op-artist-name" class="input op-msg-input" placeholder="Nome do Artista / Banda...">
        <input id="op-artist-starttime" class="input input-mono" style="width: 78px; font-size: 16px !important; text-align: center; border-radius: 10px;" placeholder="21:00" title="Horário de Entrada">
        <input id="op-artist-duration" class="input input-mono" style="width: 78px; font-size: 16px !important; text-align: center; border-radius: 10px;" value="30:00" placeholder="MM:SS" title="Duração">
      </div>
      <div class="op-msg-row">
        <input id="op-artist-notes" class="input op-msg-input" placeholder="📝 Notas para este artista (opcional)...">
      </div>
      <div class="op-presets" style="margin-bottom: 10px;">
        <button type="button" class="op-dur-chip" data-min="5">5m</button>
        <button type="button" class="op-dur-chip" data-min="15">15m</button>
        <button type="button" class="op-dur-chip" data-min="30">30m</button>
        <button type="button" class="op-dur-chip" data-min="45">45m</button>
        <button type="button" class="op-dur-chip" data-min="60">60m</button>
        <button type="button" class="op-dur-chip" data-min="90">1h30</button>
      </div>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
        <button id="op-add-artist-btn" class="btn btn-primary" style="padding: 12px; font-weight: 600; border-radius: 10px;">+ Adicionar à Fila</button>
        <button id="op-live-artist-btn" class="btn btn-success" style="padding: 12px; font-weight: 600; border-radius: 10px;">🔴 Criar e Pôr no Ar</button>
      </div>
    </section>

    <!-- Timer Queue List -->
    <section class="op-section" style="margin-bottom: 24px;">
      <div class="op-section-title" style="flex-wrap: wrap; gap: 6px;">
        <span>📋 Lineup / Fila de Artistas</span>
        <div style="display: flex; gap: 4px; flex-wrap: wrap;">
          <label for="op-import-file" class="btn btn-sm" style="padding: 3px 8px; font-size: 0.7rem; background: rgba(108, 92, 231, 0.2); border-color: var(--accent); color: #fff; cursor: pointer;">📂 Ficheiro</label>
          <input type="file" id="op-import-file" accept=".pdf,.xlsx,.xls,.csv,.txt" style="display: none;">
          <button class="btn btn-sm op-preset-day" data-day="1" style="padding: 3px 7px; font-size: 0.7rem;">Dia 1</button>
          <button class="btn btn-sm op-preset-day" data-day="2" style="padding: 3px 7px; font-size: 0.7rem;">Dia 2</button>
          <button class="btn btn-sm op-preset-day" data-day="3" style="padding: 3px 7px; font-size: 0.7rem;">Dia 3</button>
          <button class="btn btn-sm op-preset-day" data-day="4" style="padding: 3px 7px; font-size: 0.7rem;">Dia 4</button>
        </div>
      </div>
      <div id="op-queue-list" class="op-queue-list">
        <!-- Populated by JS -->
      </div>
    </section>
  </div>

  <!-- PDF.js & SheetJS for client-side file parsing -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="js/schedule-importer.js"></script>

  <!-- Access Control (Password: 1379 or brito) -->
  <script src="js/auth.js"></script>
  <!-- Cloud MQTT over WSS for reliable multi-network sync -->
  <script src="https://unpkg.com/mqtt@5.10.4/dist/mqtt.min.js"></script>
  <script src="js/local-sync.js"></script>
  <script src="js/operator.js"></script>
</body>
</html>
