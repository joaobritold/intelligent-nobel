<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0a0a14"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6c5ce7"/>
      <stop offset="100%" stop-color="#00b894"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="24" y="24" width="464" height="464" rx="92" fill="none" stroke="url(#accent)" stroke-width="10" opacity="0.85"/>
  <!-- Top stage status pill -->
  <rect x="156" y="76" width="200" height="38" rx="19" fill="#6c5ce7" opacity="0.25"/>
  <circle cx="186" cy="95" r="8" fill="#00b894"/>
  <text x="270" y="102" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#e8e8e8" text-anchor="middle" letter-spacing="2">ON STAGE</text>
  <!-- Big digital countdown -->
  <text x="256" y="295" font-family="monospace" font-size="136" font-weight="800" fill="#00b894" text-anchor="middle">05:00</text>
  <!-- Bottom linear progress bar -->
  <rect x="68" y="380" width="376" height="22" rx="11" fill="#16213e"/>
  <rect x="68" y="380" width="260" height="22" rx="11" fill="url(#accent)"/>
  <!-- Brand label -->
  <text x="256" y="446" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#8892a4" text-anchor="middle" letter-spacing="4">STAGETIMER PFP</text>
</svg>
