<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="StageTimer">
  <meta name="theme-color" content="#0f0f1a">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="icon.svg">
  <title>StageTimer — Modo Palco</title>
  <link rel="stylesheet" href="css/common.css?v=39">
  <link rel="stylesheet" href="css/viewer.css?v=39">
</head>
<body>
  <div class="viewer">
    <!-- Connection Status Indicator -->
    <div id="viewer-connection" class="viewer-connection disconnected" title="Connection status"></div>

    <!-- Top Control Bar (Stage Badge & Fast Navigation) -->
    <div id="viewer-top-bar" class="viewer-top-bar" style="position: absolute; top: calc(12px + env(safe-area-inset-top, 0px)); left: calc(16px + env(safe-area-inset-left, 0px)); display: flex; align-items: center; gap: 8px; background: rgba(15, 23, 42, 0.88); backdrop-filter: blur(10px); padding: 6px 12px; border-radius: 10px; border: 1px solid rgba(255, 255, 255, 0.14); box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5); z-index: 50; transition: opacity 0.3s ease;">
      <div style="display: flex; align-items: center; gap: 6px;">
        <span style="font-size: 0.95rem;">🎪</span>
        <span id="viewer-stage-badge" style="color: #55efc4; font-size: 0.82rem; font-weight: 800; padding: 2px 8px; border-radius: 6px; background: rgba(0, 184, 148, 0.15); max-width: 200px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Palco</span>
      </div>
      <div style="width: 1px; height: 16px; background: rgba(255,255,255,0.2);"></div>
      <a href="index.html" class="btn btn-sm" style="padding: 3px 8px; font-size: 0.72rem; text-decoration: none; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.15); color: #cbd5e1; border-radius: 6px;">🏠 Início</a>
      <a id="viewer-lineup-btn" href="lineup.html" class="btn btn-sm" style="padding: 3px 8px; font-size: 0.72rem; text-decoration: none; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.15); color: #cbd5e1; border-radius: 6px;">📋 Lista</a>
      <button id="viewer-fs-btn" type="button" class="btn btn-sm" style="padding: 3px 9px; font-size: 0.72rem; background: rgba(108, 92, 231, 0.35); border: 1px solid var(--accent); color: #fff; border-radius: 6px; cursor: pointer; display: flex; align-items: center; gap: 4px;" title="Alternar Ecrã Inteiro (F)">⛶ <span id="viewer-fs-text">Ecrã Inteiro</span></button>
    </div>

    <!-- Interactive screen hint / quick toggle for fullscreen -->
    <div id="viewer-fs-hint" class="viewer-hint" style="cursor: pointer;" title="Toque ou clique para Ecrã Inteiro">⛶ Toque para Ecrã Inteiro (F)</div>

    <!-- Active Timer Name -->
    <div id="viewer-timer-name" class="viewer-timer-name"></div>

    <!-- Big Digital Timer Display -->
    <div id="viewer-timer" class="viewer-timer">--:--</div>

    <!-- Artist Notes (Under the Clock) -->
    <div id="viewer-notes" class="viewer-notes"></div>

    <!-- Next Artist Indicator (Bottom Right) -->
    <div id="viewer-next" class="viewer-next" style="display: none;">
      <span class="viewer-next-label">NEXT:</span>
      <span id="viewer-next-name" class="viewer-next-name"></span>
    </div>

    <!-- Local Time Clock (Bottom Left) -->
    <div id="viewer-local-clock" class="viewer-local-clock">
      <span class="viewer-clock-label">HORA LOCAL</span>
      <span id="viewer-clock-time">--:--:--</span>
    </div>

    <!-- Empty state when no timer is active -->
    <div id="viewer-empty" class="viewer-empty" style="display: none;">
      <div class="viewer-empty-icon">⏳</div>
      <div class="viewer-empty-text">Standby — Waiting for Timer</div>
    </div>

    <!-- Bottom Progress Bar -->
    <div class="viewer-progress">
      <div id="viewer-progress-bar" class="viewer-progress-bar"></div>
    </div>

    <!-- Prompter Message Overlay -->
    <div id="viewer-message" class="viewer-message"></div>

    <!-- Overtime / Finish Flash effect -->
    <div id="flash-overlay" class="viewer-flash-overlay"></div>
  </div>

  <!-- Cloud MQTT over WSS for reliable multi-network sync -->
  <script src="https://unpkg.com/mqtt@5.10.4/dist/mqtt.min.js"></script>
  <!-- Local browser sync + Cloud -->
  <script src="js/pwa.js?v=39"></script>
  <script src="js/local-sync.js?v=39"></script>
  <script src="js/viewer.js?v=39"></script>
</body>
</html>
