<!DOCTYPE html>
<html lang="pt">
<head>
  <script>
    (function() {
      try {
        var EPOCH_KEY = 'stagetimer_epoch_clean_v10';
        if (localStorage.getItem(EPOCH_KEY) !== 'true') {
          var mActive = localStorage.getItem('stagetimer_master_active');
          var mV12 = localStorage.getItem('stagetimer_master_auth_v12');
          var devUuid = localStorage.getItem('stagetimer_device_uuid');

          var keys = [];
          for (var i = 0; i < localStorage.length; i++) {
            var k = localStorage.key(i);
            if (k && k.indexOf('stagetimer_') === 0) {
              keys.push(k);
            }
          }
          for (var j = 0; j < keys.length; j++) {
            localStorage.removeItem(keys[j]);
          }
          try { sessionStorage.clear(); } catch (_) {}

          if (mActive) localStorage.setItem('stagetimer_master_active', mActive);
          if (mV12) localStorage.setItem('stagetimer_master_auth_v12', mV12);
          if (devUuid) localStorage.setItem('stagetimer_device_uuid', devUuid);

          localStorage.setItem(EPOCH_KEY, 'true');

          if ('caches' in window) {
            caches.keys().then(function(names) {
              for (var n of names) caches.delete(n);
            }).catch(function() {});
          }
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              for (var r of regs) r.unregister();
            }).catch(function() {});
          }
        }
      } catch (e) {}
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="StageTimer">
  <meta name="theme-color" content="#0f0f1a">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="icon.svg">
  <title>StageTimer — Modo Lista (Lineup & Horários)</title>
  <link rel="stylesheet" href="css/common.css?v=60">
  <link rel="stylesheet" href="css/lineup.css?v=60">
</head>
<body>
  <div id="lineup-screen" class="lineup-screen">
    <!-- Top Header -->
    <header class="lineup-header">
      <div class="lineup-title-box" style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap;">
        <span style="font-size: 1.7rem;">📋</span>
        <div>
          <div class="lineup-title">Lineup & Horários</div>
        </div>
        <!-- Event / Stage Badge -->
        <div style="display: flex; align-items: center; gap: 6px; background: rgba(108, 92, 231, 0.22); border: 1px solid rgba(108, 92, 231, 0.5); padding: 4px 10px; border-radius: 8px;">
          <span style="font-size: 0.9rem;">🎪</span>
          <span id="lineup-stage-badge" style="color: #55efc4; font-size: 0.85rem; font-weight: 800; max-width: 200px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Palco</span>
          <select id="lineup-event-select" class="master-stage-select" style="display: none;" title="👑 Trocar Palco (Modo Master)"></select>
        </div>
        <span id="lineup-room-badge" class="lineup-room-badge" style="display: none;">PALCO1</span>
        <div id="lineup-day-tabs" style="display: flex; gap: 4px; align-items: center; margin-left: 4px;"></div>
      </div>

      <div style="display: flex; gap: 8px; align-items: center;">
        <div style="display: flex; flex-direction: column; align-items: flex-end; background: rgba(0, 184, 148, 0.14); border: 1px solid rgba(0, 184, 148, 0.4); padding: 4px 10px; border-radius: 8px;">
          <span style="font-size: 0.65rem; font-weight: 700; color: #cbd5e1; text-transform: uppercase;">Fim do Evento</span>
          <span id="lineup-event-end" style="font-family: var(--font-mono); font-size: 1.1rem; font-weight: 800; color: #55efc4;">--:--</span>
        </div>
        <div class="lineup-clock-box">
          <div class="lineup-clock-label">HORA LOCAL</div>
          <div id="lineup-local-clock" class="lineup-clock-time">--:--:--</div>
        </div>
      </div>
    </header>

    <!-- Navigation Switcher -->
    <nav class="lineup-nav">
      <a id="ln-nav-hub" href="index.html" class="lineup-nav-pill">🏠 Início</a>
      <a id="ln-nav-controller" href="controller.html" class="lineup-nav-pill">🎛️ Configurador</a>
      <a id="ln-nav-operator" href="operator.html" class="lineup-nav-pill">📱 Operador</a>
      <a id="ln-nav-viewer" href="viewer.html" class="lineup-nav-pill">📺 Modo Palco</a>
      <a id="ln-nav-lineup" href="lineup.html" class="lineup-nav-pill active">📋 Modo Lista</a>
      <a id="ln-nav-master" href="master.html" class="lineup-nav-pill" style="display: none; color: #fdcb6e; border-color: rgba(253, 203, 110, 0.4);">👑 Master</a>
    </nav>

    <!-- Main Content: Active Stage + Full Artist List -->
    <div class="lineup-body">
      <!-- Left / Top: Currently on Stage -->
      <aside id="lineup-now-card" class="lineup-now-card">
        <div id="lineup-now-badge" class="lineup-now-badge">● EM PALCO AGORA</div>
        <div id="lineup-now-name" class="lineup-now-name">--</div>
        <div id="lineup-now-slot" class="lineup-now-slot"></div>
        <div id="lineup-now-timer" class="lineup-now-timer">--:--</div>
        <div id="lineup-now-notes" class="lineup-now-notes" style="display: none;"></div>
      </aside>

      <!-- Right / Bottom: Full Schedule List -->
      <main class="lineup-main-scroll">
        <div id="lineup-list" class="lineup-list-container">
          <!-- Injected by JS -->
        </div>
      </main>
    </div>
  </div>

  <!-- Cloud MQTT over WSS -->
  <script src="https://unpkg.com/mqtt@5.10.4/dist/mqtt.min.js"></script>
  <script src="js/pwa.js?v=60"></script>
  <script src="js/local-sync.js?v=60"></script>
  <script src="js/lineup.js?v=60"></script>
</body>
</html>
