<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, shrink-to-fit=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ShowFlow Watch">
  <meta name="theme-color" content="#000000">
  <title>ShowFlow — Apple Watch</title>
  <link rel="stylesheet" href="css/watch.css?v=2.04">
  <script>
    // Inicialização visual instantânea (0ms) antes do download de scripts externos
    document.addEventListener('DOMContentLoaded', function() {
      try {
        var p = new URLSearchParams(window.location.search);
        var r = (p.get('room') || 'PALCO1').toUpperCase().trim();
        var $name = document.getElementById('watch-artist-name');
        var $clock = document.getElementById('watch-clock-time');
        if ($name) $name.textContent = r;
        function updateFastClock() {
          if ($clock) {
            var d = new Date();
            var h = String(d.getHours()).padStart(2, '0');
            var m = String(d.getMinutes()).padStart(2, '0');
            var s = String(d.getSeconds()).padStart(2, '0');
            $clock.textContent = h + ':' + m + ':' + s;
          }
        }
        updateFastClock();
        setInterval(updateFastClock, 1000);
      } catch (_) {}
    });
  </script>
</head>
<body class="watch-body">
  <div class="viewer watch-viewer">
    <!-- Ponto de Ligação no Canto Superior Esquerdo -->
    <div id="watch-status-dot" class="viewer-connection disconnected" title="Estado de Ligação"></div>

    <!-- Nome do Artista em Palco no Topo -->
    <div id="watch-artist-name" class="viewer-timer-name">PALCO1</div>

    <!-- Cronómetro Gigante no Centro -->
    <div id="watch-timer" class="viewer-timer safe">00:00</div>

    <!-- Notas do Artista (Debaixo do Relógio) -->
    <div id="viewer-notes" class="viewer-notes"></div>

    <!-- Próximo Artista (Canto Inferior Direito) -->
    <div id="watch-next" class="viewer-next" style="display: none;">
      <span class="viewer-next-label">NEXT:</span>
      <span id="watch-next-name" class="viewer-next-name"></span>
    </div>

    <!-- Hora Local (Canto Inferior Esquerdo) -->
    <div id="watch-local-clock" class="viewer-local-clock">
      <span class="viewer-clock-label">HORA</span>
      <span id="watch-clock-time">--:--:--</span>
    </div>

    <!-- Barra de Progresso Fina na Base -->
    <div class="viewer-progress">
      <div id="watch-progress-bar" class="viewer-progress-bar"></div>
    </div>

    <!-- Overlay de Mensagem da Régie -->
    <div id="watch-message-overlay" class="watch-message-overlay">
      <div id="watch-msg-badge" class="watch-msg-badge">AVISO</div>
      <div id="watch-msg-text" class="watch-msg-text"></div>
    </div>
  </div>

  <!-- Scripts: Apenas os necessários, sem Service Worker nem bloqueios -->
  <script src="js/st-icons.js?v=2.04"></script>
  <script src="js/mqtt.min.js?v=2.04"></script>
  <script src="js/local-sync.js?v=2.04"></script>
  <script src="js/watch.js?v=2.04"></script>
</body>
</html>
