<!DOCTYPE html>
<html lang="pt">
<head>
  <script>
    (function() {
      try {
        var EPOCH_KEY = 'stagetimer_epoch_clean_v10';
        if (localStorage.getItem(EPOCH_KEY) !== 'true') {
          var mActive = localStorage.getItem('stagetimer_master_active');
          var mV12 = localStorage.getItem('stagetimer_master_auth_v12');
          var devUuid = localStorage.getItem('stagetimer_device_uuid');

          var keys = [];
          for (var i = 0; i < localStorage.length; i++) {
            var k = localStorage.key(i);
            if (k && k.indexOf('stagetimer_') === 0) {
              keys.push(k);
            }
          }
          for (var j = 0; j < keys.length; j++) {
            localStorage.removeItem(keys[j]);
          }
          try { sessionStorage.clear(); } catch (_) {}

          if (mActive) localStorage.setItem('stagetimer_master_active', mActive);
          if (mV12) localStorage.setItem('stagetimer_master_auth_v12', mV12);
          if (devUuid) localStorage.setItem('stagetimer_device_uuid', devUuid);

          localStorage.setItem(EPOCH_KEY, 'true');

          if ('caches' in window) {
            caches.keys().then(function(names) {
              for (var n of names) caches.delete(n);
            }).catch(function() {});
          }
        }
      } catch (e) {}
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, shrink-to-fit=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Stage Watch">
  <meta name="theme-color" content="#000000">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <title>StageTimer — Apple Watch</title>
  <link rel="stylesheet" href="css/common.css?v=124">
  <link rel="stylesheet" href="css/watch.css?v=124">
</head>
<body>
  <!-- Container principal otimizado para preencher 100% do ecrã do Apple Watch -->
  <div id="watch-container" class="watch-container mode-timer">
    <!-- Barra Superior (Status, Palco, Mini-Relógio) -->
    <div class="watch-top">
      <div class="watch-top-left">
        <div id="watch-status-dot" class="watch-status-dot" title="Estado de Conexão"></div>
        <span id="watch-stage-badge" class="watch-stage-badge" title="Tocar para alternar palco">PALCO</span>
      </div>
      <div id="watch-mini-clock" class="watch-mini-clock">--:--</div>
    </div>

    <!-- Ecrã Central (Números Gigantes preenchendo a tela toda) -->
    <div id="watch-center" class="watch-center">
      <div id="watch-digits" class="watch-digits clock">--:--</div>
      <div id="watch-secondary" class="watch-secondary"></div>
      <div id="watch-info" class="watch-info">A carregar...</div>
    </div>

    <!-- Barra Inferior (Fim Previsto do Evento & Indicador de Modo) -->
    <div class="watch-bottom">
      <div id="watch-event-end" class="watch-event-end" title="Fim Previsto do Evento">
        <span id="watch-event-end-val">🏁 Fim: --:--</span>
      </div>
      <span id="watch-mode-pill" class="watch-mode-pill">Timer</span>
    </div>

    <!-- Toast de Feedback Rápido ao Tocar no Ecrã -->
    <div id="watch-mode-toast" class="watch-mode-toast">⏱️ Modo Timer</div>
  </div>

  <!-- Overlay de Mensagem Flash / Urgente da Régie -->
  <div id="watch-message-overlay">
    <div id="watch-msg-badge" class="watch-msg-badge">AVISO</div>
    <div id="watch-msg-text" class="watch-msg-text">MENSAGEM DE PALCO</div>
  </div>

  <!-- Banner informativo se aberto em PC ou Tablet -->
  <div id="watch-desktop-banner">
    ⌚ <strong>Ecrã Apple Watch</strong> | Para abrir no relógio: envia o link por iMessage ou cria um atalho na app <em>Atalhos (Shortcuts)</em> do iPhone.
    &nbsp;<a href="index.html">← Voltar ao Início</a>
  </div>

  <script src="js/local-sync.js?v=124"></script>
  <script src="js/watch.js?v=124"></script>
</body>
</html>
