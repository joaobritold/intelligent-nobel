<!DOCTYPE html>
<html lang="pt">
<head>
  <script>
    (function() {
      try {
        var EPOCH_KEY = 'stagetimer_epoch_clean_v10';
        if (localStorage.getItem(EPOCH_KEY) !== 'true') {
          var mActive = localStorage.getItem('stagetimer_master_active');
          var mV12 = localStorage.getItem('stagetimer_master_auth_v12');
          var devUuid = localStorage.getItem('stagetimer_device_uuid');

          var keys = [];
          for (var i = 0; i < localStorage.length; i++) {
            var k = localStorage.key(i);
            if (k && k.indexOf('stagetimer_') === 0) {
              keys.push(k);
            }
          }
          for (var j = 0; j < keys.length; j++) {
            localStorage.removeItem(keys[j]);
          }
          try { sessionStorage.clear(); } catch (_) {}

          if (mActive) localStorage.setItem('stagetimer_master_active', mActive);
          if (mV12) localStorage.setItem('stagetimer_master_auth_v12', mV12);
          if (devUuid) localStorage.setItem('stagetimer_device_uuid', devUuid);

          localStorage.setItem(EPOCH_KEY, 'true');

          if ('caches' in window) {
            caches.keys().then(function(names) {
              for (var n of names) caches.delete(n);
            }).catch(function() {});
          }
        }
      } catch (e) {}
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, shrink-to-fit=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Stage Watch">
  <meta name="theme-color" content="#000000">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <title>StageTimer — Apple Watch</title>
  <link rel="stylesheet" href="css/common.css?v=133">
  <link rel="stylesheet" href="css/watch.css?v=133">
</head>
<body>
  <!-- Ecrã Apple Watch: Vista de Palco Limpa (Idêntica ao Modo Palco) -->
  <div id="watch-container" class="watch-container">
    <!-- Topo: Nome do Artista em Palco + Dot de Conexão -->
    <header class="watch-header">
      <div id="watch-status-dot" class="watch-status-dot disconnected" title="Ligação"></div>
      <div id="watch-artist-name" class="watch-artist-name">A carregar...</div>
    </header>

    <!-- Centro: Dígitos Gigantes de Palco (Conta Normal & Negativo em Vermelho) -->
    <main class="watch-main">
      <div id="watch-timer" class="watch-timer safe">--:--</div>
    </main>

    <!-- Base: Hora Local à esquerda, NEXT à direita (Igual ao Modo Palco) -->
    <footer class="watch-footer">
      <div class="watch-clock">
        <span class="watch-footer-label">HORA</span>
        <span id="watch-clock-time">--:--:--</span>
      </div>
      <div id="watch-next" class="watch-next" style="display: none;">
        <span class="watch-footer-label">NEXT:</span>
        <span id="watch-next-name">--</span>
      </div>
    </footer>

    <!-- Barra de Progresso Fina na Base -->
    <div class="watch-progress-track">
      <div id="watch-progress-bar" class="watch-progress-bar"></div>
    </div>
  </div>

  <!-- Overlay de Mensagem da Régie (Igual ao Modo Palco) -->
  <div id="watch-message-overlay" class="watch-message-overlay">
    <div id="watch-msg-badge" class="watch-msg-badge">AVISO</div>
    <div id="watch-msg-text" class="watch-msg-text"></div>
  </div>

  <!-- Cloud MQTT over WSS -->
  <script src="https://unpkg.com/mqtt@5.10.4/dist/mqtt.min.js"></script>
  <script src="js/pwa.js?v=133"></script>
  <script src="js/local-sync.js?v=133"></script>
  <script src="js/watch.js?v=133"></script>
</body>
</html>
