<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, shrink-to-fit=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ShowFlow Watch">
  <meta name="theme-color" content="#000000">
  <meta name="robots" content="noindex, nofollow">
  <title>ShowFlow — Apple Watch</title>
  <link rel="stylesheet" href="css/watch.css?v=2.23">
  <script>
    // Inicialização visual instantânea (0ms) antes do download de scripts externos
    document.addEventListener('DOMContentLoaded', function() {
      try {
        var p = new URLSearchParams(window.location.search);
        var r = (p.get('room') || 'PALCO1').toUpperCase().trim();
        var $name = document.getElementById('watch-artist-name');
        var $clock = document.getElementById('watch-clock-time');
        var $dot = document.getElementById('watch-status-dot');
        var $endVal = document.getElementById('watch-event-end');
        if ($name) $name.textContent = r;

        function updateFastClock() {
          if ($clock) {
            var d = new Date();
            var h = String(d.getHours()).padStart(2, '0');
            var m = String(d.getMinutes()).padStart(2, '0');
            var s = String(d.getSeconds()).padStart(2, '0');
            $clock.textContent = h + ':' + m + ':' + s;
          }
        }
        updateFastClock();
        setInterval(updateFastClock, 1000);

        // Pré-carregamento imediato via HTTPS Relay (100% seguro para Apple Watch sobre Bluetooth)
        var cleanRoom = r.replace(/[^A-Z0-9_-]/g, '');
        fetch('https://ntfy.sh/showflow_v10_' + cleanRoom + '/json?poll=1', { cache: 'no-store' })
          .then(function(res) { return res.text(); })
          .then(function(text) {
            if (!text || !text.trim()) return;
            var lines = text.trim().split('\n');
            for (var i = lines.length - 1; i >= 0; i--) {
              try {
                var item = JSON.parse(lines[i]);
                if (item.event === 'message' && item.message) {
                  var incoming = JSON.parse(item.message);
                  if (incoming && Array.isArray(incoming.timers)) {
                    window.__INITIAL_WATCH_STATE__ = incoming;
                    if ($dot) $dot.classList.remove('disconnected');
                    var activeT = incoming.timers.find(function(t) { return t.id === incoming.activeTimerId; }) ||
                                  incoming.timers.find(function(t) { return t.state === 'running'; });
                    if (activeT && $name) {
                      $name.textContent = activeT.name || incoming.name || r;
                    }
                    if (incoming.eventEndTime && $endVal) {
                      $endVal.textContent = incoming.eventEndTime;
                    }
                    break;
                  }
                }
              } catch (_) {}
            }
          }).catch(function() {});
      } catch (_) {}
    });
  </script>
</head>
<body class="watch-body">
  <div class="watch-layout">
    <!-- Barra Superior: Dot de Ligação + Nome Artista/Palco + Badge de Estado -->
    <header class="watch-top-bar">
      <div id="watch-status-dot" class="watch-dot disconnected" title="Estado de Ligação"></div>
      <div id="watch-artist-name" class="watch-title">PALCO1</div>
      <div id="watch-state-badge" class="watch-badge standby">STANDBY</div>
    </header>

    <!-- Centro: Dígitos Gigantes com Contagem e Overtime Negativo -->
    <main class="watch-timer-wrapper">
      <div id="watch-timer" class="watch-digits safe">00:00</div>
    </main>

    <!-- Destaque Operacional: Fim Previsto do Evento / Show -->
    <div id="watch-end-row" class="watch-end-box">
      <span class="watch-end-tag">🏁 FIM SHOW</span>
      <span id="watch-event-end" class="watch-end-time">--:--</span>
    </div>

    <!-- Barra Inferior: Hora Local e Próximo Artista -->
    <footer class="watch-bottom-bar">
      <div id="watch-local-clock" class="watch-info-pill watch-clock-pill">
        <span class="watch-pill-icon">🕒</span>
        <span id="watch-clock-time">--:--:--</span>
      </div>
      <div id="watch-next" class="watch-info-pill watch-next-pill" style="display: none;">
        <span class="watch-pill-icon">⏭️</span>
        <span id="watch-next-name" class="watch-pill-text">--</span>
      </div>
    </footer>

    <!-- Barra Fina de Progresso na Base Absoluta -->
    <div class="watch-progress-track">
      <div id="watch-progress-bar" class="watch-progress-fill"></div>
    </div>

    <!-- Overlay de Mensagem Urgente da Régie -->
    <div id="watch-message-overlay" class="watch-alert-overlay">
      <div id="watch-msg-badge" class="watch-alert-badge">AVISO DA RÉGIE</div>
      <div id="watch-msg-text" class="watch-alert-text"></div>
    </div>
  </div>

  <!-- Scripts: Sincronização Híbrida Inteligente para watchOS -->
  <script src="js/st-icons.js?v=2.23"></script>
  <script src="js/mqtt.min.js?v=2.23"></script>
  <script src="js/local-sync.js?v=2.23"></script>
  <script src="js/watch.js?v=2.23"></script>
</body>
</html>
